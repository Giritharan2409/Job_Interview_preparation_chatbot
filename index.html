<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Prep Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Interview Prep Chatbot</h1>
            <p>Practice interview questions and get instant feedback</p>
        </header>

        <div class="main-content">
            <!-- Domain Selection -->
            <div id="domainSelection" class="section">
                <h2>Select Your Domain</h2>
                <div class="domain-grid">
                    <button class="domain-btn" data-domain="Aptitude" data-type="mcq">
                        <span class="icon">🧮</span>
                        <span>Aptitude Test</span>
                    </button>
                    <button class="domain-btn" data-domain="HR Interview" data-type="mcq">
                        <span class="icon">👥</span>
                        <span>HR Interview</span>
                    </button>
                    <button class="domain-btn" data-domain="IT">
                        <span class="icon">💻</span>
                        <span>IT & Software</span>
                    </button>
                    <button class="domain-btn" data-domain="Core Engineering">
                        <span class="icon">⚙️</span>
                        <span>Core Engineering</span>
                    </button>
                    <button class="domain-btn" data-domain="Finance">
                        <span class="icon">💰</span>
                        <span>Finance</span>
                    </button>
                    <button class="domain-btn" data-domain="Marketing">
                        <span class="icon">📊</span>
                        <span>Marketing</span>
                    </button>
                </div>
            </div>

            <!-- Chat Interface -->
            <div id="chatInterface" class="section hidden">
                <div class="chat-header">
                    <div class="selected-domain">
                        <span id="currentDomain"></span>
                    </div>
                    <button id="changeDomain" class="btn-secondary">Change Domain</button>
                </div>

                <div id="chatBox" class="chat-box">
                    <div class="message bot-message">
                        <div class="message-content">
                            <p>Hello! I'm your interview prep assistant. Click "Get Question" to start practicing!</p>
                        </div>
                    </div>
                </div>

                <div class="input-area">
                    <textarea 
                        id="userAnswer" 
                        placeholder="Type your answer here..." 
                        rows="3"
                        disabled
                    ></textarea>
                    <div class="button-group">
                        <button id="getQuestion" class="btn-primary">Get Question</button>
                        <button id="submitAnswer" class="btn-primary" disabled>Submit Answer</button>
                        <button id="getModelAnswer" class="btn-secondary" disabled>Show Model Answer</button>
                    </div>
                </div>

                <div id="loadingIndicator" class="loading hidden">
                    <div class="spinner"></div>
                    <p>Thinking...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
